<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1470" viewBox="0 0 1200 1470" role="img" aria-labelledby="title desc">
<title id="title">Cloud Coordination Hub — previously verified Plan B AWS architecture</title>
<desc id="desc">Students and organizers use CloudFront HTTPS. A CloudFront VPC origin connects to an internal ALB in VPC 10.43.0.0/16, us-east-1. An Auto Scaling group maintains two private Docker application instances across two Availability Zones, with maximum capacity three. Both instances share private encrypted Single-AZ RDS PostgreSQL over verified TLS. An S3 gateway endpoint provides private release and log transport. CloudWatch supplies native infrastructure metrics and three alarms. CloudFormation manages the infrastructure.</desc>
