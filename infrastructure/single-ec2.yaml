AWSTemplateFormatVersion: '2010-09-09'
Description: Optional single Ubuntu EC2 classroom deployment; no IAM or managed databases.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Existing subnet in VpcId with an Internet Gateway route.
  UbuntuAmiId:
    Type: AWS::EC2::Image::Id
    Description: Verified Ubuntu 24.04 LTS amd64 AMI in your region (Canonical owner 099720109477).
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  SshCidr:
    Type: String
    Description: Your public IPv4 followed by /32. Never use 0.0.0.0/0.
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/32'
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t2.micro, t3.small]
  VolumeSize:
    Type: Number
    Default: 16
    MinValue: 10
    MaxValue: 30
Conditions:
  IsT3: !Not [!Equals [!Ref InstanceType, t2.micro]]
Resources:
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSH from student IP; HTTP and HTTPS classroom application
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      CreditSpecification:
        !If [IsT3, { CPUCredits: standard }, !Ref 'AWS::NoValue']
      KeyName: !Ref KeyName
      MetadataOptions:
        HttpTokens: required
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Ref PublicSubnetId
          GroupSet: [!Ref AppSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: cloud-coordination-hub-demo
Outputs:
  InstanceId:
    Value: !Ref AppInstance
  PublicIp:
    Value: !GetAtt AppInstance.PublicIp
  DemoUrl:
    Value: !Sub 'http://${AppInstance.PublicIp}'
