# Opt-in local PostgreSQL. Existing Compose/SQLite/DynamoDB configuration is preserved.
services:
  postgres:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_USER: cch_local
      POSTGRES_PASSWORD: LocalOnlyPassword123
      POSTGRES_DB: cloudhub
    ports: ['127.0.0.1:5432:5432']
    volumes: [cch-postgres-local:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cch_local -d cloudhub']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  cch-postgres-local:
