name: Cloud Coordination Hub CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.1.0
        ports: [8000:8000]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:dynamodb
        env:
          DYNAMODB_ENDPOINT: http://127.0.0.1:8000
      - run: npm run test:e2e
      - run: node scripts/production-smoke.mjs
      - run: bash -n scripts/deploy-ec2.sh
      - run: npm run infra:validate
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r infrastructure/requirements.txt
      - run: cfn-lint infrastructure/hub.yaml infrastructure/single-ec2.yaml
      - run: docker build -t cloud-coordination-hub:ci .
      - uses: actions/upload-artifact@v7
        with:
          name: application-build
          path: dist
          retention-days: 7
# No AWS credentials, OIDC, infrastructure deployment, or image publication.
