name: Cloud Coordination Hub CD

on:
  workflow_run:
    workflows: ['Cloud Coordination Hub CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  prepare-deployment:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: cloud-coordination-hub-build
          path: |
            dist/frontend/
            dist/backend/backend/
            dist/backend/shared/
            package.json
            package-lock.json
            Dockerfile
            infrastructure/
            scripts/install-offline.sh
          retention-days: 7
          if-no-files-found: error
# Preparation only: no AWS credentials, AWS calls, deployment, or image publication.
